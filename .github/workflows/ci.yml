name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: grade
          POSTGRES_PASSWORD: grade
          POSTGRES_DB: grade
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grade -d grade"
          --health-interval 2s --health-retries 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e '.[dev,db]'
      - run: ruff check . && ruff format --check .
      # The loader tests build their own database from packages/db's migrations.
      - run: pytest -q
        env:
          DATABASE_URL: postgresql://grade:grade@localhost:5432/grade

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run lint -w @grade/web
      - run: npm run typecheck -w @grade/web
      - run: npm test -w @grade/web
